@if(permission?.allowView == true){
<div class="app-content-header">
</div>
<div class="app-content">
  <div class="container-fluid p-0">
    <form #myForm="ngForm">
      <div class="contentBody">
        <div class="card p-3">
          <div class="row">

            <div class="col-12 col-lg-3 mb-2">
              <label class="form-label bold d-block">
                {{ 'ColTeamCode' | translate }}
                <div class="e-float-input e-input mt-0">
                  <input class="form-control" type="text" name="colTeamCode" id="colTeamCode"
                    [(ngModel)]="detail.colTeamCode" #colTeamCodeCtrl="ngModel"
                    placeholder="{{ 'TeamCode' | translate }}">

            <div class="col-12 col-lg-3 mb-2">
              <label class="form-label bold d-block">
                {{ 'ColTeamName' | translate }}
                <div class="e-float-input e-input mt-0">
                  <input class="form-control" type="text" name="colTeamName" id="colTeamName"
                    [(ngModel)]="detail.colTeamName" #colTeamNameCtrl="ngModel"
                    placeholder="{{ 'ColTeamName' | translate }}">
                </div>
              </label>
            </div>

            <div class="col-12 col-lg-3 mb-2">
              <label class="form-label bold d-block">
                {{ 'TeamCapacity' | translate }}
                <div class="e-float-input e-input mt-0">
                  <app-input-number name="teamCapacity" id="teamCapacity" [(ngModel)]="detail.teamCapacity"
                    #teamCapacityCtrl="ngModel" [step]="1" [min]="0">
                  </app-input-number>

                </div>
              </label>
            </div>
            <div class="col-12 col-lg-3 mb-2">
            </div>

            <div class="col-12 col-lg-3 mb-2">
              <label class="form-label bold d-block">
                {{ 'CollectorId' | translate }}
                <div class="e-float-input e-input mt-0">
                  <input class="form-control" type="text" name="collectorEmpId" id="collectorEmpId"
                    [(ngModel)]="detail.collectorEmpId" #collectorEmpIdCtrl="ngModel"
                    placeholder="{{ 'CollectorId' | translate }}">
                </div>
              </label>
            </div>

            <div class="col-12 col-lg-3 mb-2">
              <label class="form-label bold d-block">
                {{ 'CollectorName' | translate }}
                <div class="e-float-input e-input mt-0">
                  <input class="form-control" type="text" name="collectorEmpName" id="collectorEmpName"
                    [(ngModel)]="detail.collectorEmpName" #collectorEmpNameCtrl="ngModel"
                    placeholder="{{ 'CollectorName' | translate }}">
                </div>
              </label>
            </div>

            <div class="col-12 col-lg-3 mb-2">
              <label class="form-label bold d-block">
                {{ 'ColRoleName' | translate }}
                <div class="e-float-input e-input mt-0">
                  <input class="form-control" type="text" name="colRoleName" id="colRoleName"
                    [(ngModel)]="detail.colRoleName" #colTeamNameCtrl="ngModel"
                    placeholder="{{ 'ColRoleName' | translate }}">
                </div>
              </label>

                <div class="d-flex flex-wrap gap-4">
                  <div class="d-flex items-center gap-2">
                    <div class="col-12 py-2">
                      <label class="form-label d-block">
                      <input class="form-check-input" type="checkbox" id="supervisor" name="supervisor"
                        [(ngModel)]="detail.isSupervisor" />

                    </div>
                  </div>
                </div>

                <div class="e-float-input e-input mt-0">

                    [step]="1" required [class.is-invalid]="capacityCtrl.invalid && capacityCtrl.touched">

@if(permission?.allowView === false){
<div class="d-flex justify-content-center align-items-center vh-100">
  <h2 class="text-muted">{{'No Permission' | translate}}</h2>
</div>
}

<div modal-footer class="modal-footer border-top pt-2">
  <div class="row w-100">
    <div class="col d-flex justify-content-center gap-2">

      <button type="button" ejs-button class="ejs-button-center" cssClass="e-primary" iconCss="fa-solid fa-floppy-disk"
        [disabled]="!form?.dirty || !(permission?.allowEdit)" (click)="onSave()" appDebounceClick>
        {{ 'Save' | translate }}
      </button>

      <button type="button" ejs-button class="ejs-button-center" cssClass="e-primary" iconCss="fa-solid fa-rotate-left"
        [disabled]="!form?.dirty || !(permission?.allowEdit)" (click)="doCancel()">
        {{ "Cancel" | translate }}
      </button>

      <button type="button" ejs-button class="ejs-button-center" cssClass="e-primary" iconCss="fas fa-times"
        (click)="close()">
        {{ "Close" | translate }}
      </button>

    </div>
  </div>
</div>
