@if (permission?.allowView) {
<div class="app-content-header">
  <div class="container-fluid">
    <app-header [header]="header"></app-header>
  </div>
  <div class="app-content">
    <div class="container-fluid p-0">
      <form #myForm="ngForm">
        <div class="card p-3">
          <app-toolbar class="mb-2" [showButton]="actionListbtn" [dirty]="form?.dirty && permission?.allowEdit"
            (clickBtnBack)="doBack()" (clickBtnSave)="doSave()" (clickBtnCancel)="doCancel()">
          </app-toolbar>

          <div class="row">
            <div class="col-12 col-lg-4 mb-2">
              <label class="form-label bold d-block">
                {{ 'EmployeeId' | translate }}
                <input class="form-control" type="text" tabindex="0" name="EmployeeId" id="EmployeeId" [readonly]="true"
                  placeholder="{{ 'EmployeeId' | translate }}" [(ngModel)]="detail.employeeId">
              </label>
            </div>

            <div class="col-12 col-lg-4 mb-2">
              <label class="form-label bold d-block">
                {{ 'EmployeeName' | translate }}
                <input class="form-control" type="text" tabindex="0" name="EmployeeName" id="EmployeeName" [readonly]="true"
                  placeholder="{{ 'EmployeeName' | translate }}" [(ngModel)]="detail.employeeName">
              </label>
            </div>

            <div class="col-12 col-lg-4 mb-2">
              <label class="form-label bold d-block">
                {{ 'Department' | translate }}
                <input class="form-control" type="text" tabindex="0" name="Department" id="Department" [readonly]="true"
                  placeholder="{{ 'Department' | translate }}" [(ngModel)]="detail.employeeName">
              </label>
            </div>
          </div>


          <div class="row">
            <div class="col-12 col-lg-4 mb-2">
              <label class="form-label bold d-block">
                {{ 'Position' | translate }}
                <input class="form-control" type="text" tabindex="0" name="Position" id="Position" [readonly]="true"
                  placeholder="{{ 'Position' | translate }}" [(ngModel)]="detail.employeeName">
              </label>
            </div>

            <div class="col-12 col-lg-4 mb-2">
              <label class="form-label bold d-block">
                {{ 'SupervisorName' | translate }}
                <input class="form-control" type="text" tabindex="0" name="SupervisorName" id="SupervisorName" [readonly]="true"
                  placeholder="{{ 'SupervisorName' | translate }}" [(ngModel)]="detail.employeeName">
              </label>
            </div>

            <div class="col-12 col-lg-4 mb-2">
              <label class="form-label bold d-block">
                {{ 'Email' | translate }}
                <input class="form-control" type="text" tabindex="0" name="Email" id="Email" [readonly]="true"
                  placeholder="{{ 'Email' | translate }}" [(ngModel)]="detail.email">
              </label>
            </div>
          </div>


          <div class="row">
            <div class="col-12 col-lg-4 mb-2">
              <label class="form-label bold d-block">
                {{ 'WorkStatus' | translate }}
                <input class="form-control" type="text" tabindex="0" name="WorkStatus" id="WorkStatus" [readonly]="true"
                  placeholder="{{ 'WorkStatus' | translate }}" [(ngModel)]="detail.employeeName">
              </label>
            </div>

            <div class="col-12 col-lg-4 mb-2">
                <label class="form-label bold d-block">{{ 'LastUpdated' | translate }}
                  <ejs-datetimepicker [(ngModel)]="detail.isActive" name="LastUpdated" id="LastUpdated" format="dd/MM/yyyy HH:mm:ss"
                    placeholder="{{ 'LastUpdated' | translate }}" [readonly]="true">
                  </ejs-datetimepicker>
                </label>
            </div>


            <div class="col-12 col-lg-4 mb-2 bold">
             {{ 'Status' | translate }}
              <div class="d-flex flex-wrap gap-4">
                <div class="d-flex items-center gap-2">
                  <div class="col-12 py-2">
                     <label  class="form-label  d-block">
                    <input class="form-check-input" type="checkbox" id="Status" name="Status"
                      [(ngModel)]="detail.isActive" />
                    &nbsp;<strong class="ml-2">{{ 'Active' | translate }}</strong>
                    </label>
                  </div>
                </div>
              </div>
            </div>
          </div>

        </div>
      </form>
    </div>
  </div>
</div>

}

@if (permission?.allowView === false) {
<div class="d-flex justify-content-center align-items-center vh-100">
  <h2 class="text-muted">{{'No Permission' | translate}}</h2>
</div>
}
